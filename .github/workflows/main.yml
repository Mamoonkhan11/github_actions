name: Build Job
on: 
  push:
    branches: 
      - main
  #pull_request:
    #branches:
   #   - main
  #workflow_dispatch:

  #schedule:
   # - cron: '30 12 * * *' # Runs every day at midnight
permissions:
  contents: read

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Maven Build
        run: mvn install

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vprofile
          path: target/*.war

      - name: Upload test results
        if: failure()
        run: echo "Previous step failed, please check logs..."


  Testing:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Code checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run tests on main branch
        if: github.ref == 'refs/heads/main'
        run: mvn test

      - name: Checkstyle
        if: github.ref == 'refs/heads/main'
        run: mvn checkstyle:checkstyle

      - name: Test skipped
        if: github.ref != 'refs/heads/main'
        run: echo "Tests are skipped for non-main branches."