name: Build Job
on: 
  push:
    branches: 
      - main
  #pull_request:
    #branches:
   #   - main
  #workflow_dispatch:

  #schedule:
   # - cron: '30 12 * * *' # Runs every day at midnight
permissions:
  contents: read

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Maven Build
        run: mvn install

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vprofile
          path: target/*.war

      - name: Upload test results
        if: failure()
        run: echo "Previous step failed, please check logs..."


  Testing:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Code checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run tests on main branch
        if: github.ref == 'refs/heads/main'
        run: mvn test

      - name: Checkstyle
        if: github.ref == 'refs/heads/main'
        run: mvn checkstyle:checkstyle

      - name: Test skipped
        if: github.ref != 'refs/heads/main'
        run: echo "Tests are skipped for non-main branches."

  Security-Scan:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Code checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          trivy-config: trivy.yaml
          format: 'json'
          exit-code: '0'
          vulnerability-type: 'os,library'
          output: 'trivy-report.json'

      - name: Upload Trivy report
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-report.json

  Secret-Scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Code checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  OWASP-Dependency-Check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Code checkout
        uses: actions/checkout@v7

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: vprofile
          path: .
          format: HTML
          out: dependency-check-report
          args: >-
            --enableRetired
            --failOnCVSS 3

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owasp-dependency-check-report
          path: dependency-check-report
          if-no-files-found: warn

  Build-and-Publish-Docker-Image:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    environment: production
    needs: [Build, Testing, Security-Scan, Secret-Scan, OWASP-Dependency-Check]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build tag and push Docker image
        id: build-and-push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          docker build -f Docker-files/app/multistage/Dockerfile -t $ECR_REGISTRY/${{ vars.ECR_REPOSITORY_NAME }}:$IMAGE_TAG .
          docker push $ECR_REGISTRY/${{ vars.ECR_REPOSITORY_NAME }}:$IMAGE_TAG

  Slack-Notification:
    name: Slack Notification
    runs-on: ubuntu-latest
    environment: production
    needs: [Build, Testing, Security-Scan, Secret-Scan, OWASP-Dependency-Check, Build-and-Publish-Docker-Image]
    if: always()
    steps:
      - name: Send workflow result to Slack
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "GitHub Actions: ${{ github.workflow }} - ${{ needs.Build.result == 'success' && needs.Testing.result == 'success' && needs.Security-Scan.result == 'success' && needs.Secret-Scan.result == 'success' && needs.OWASP-Dependency-Check.result == 'success' && (needs.Build-and-Publish-Docker-Image.result == 'success' || needs.Build-and-Publish-Docker-Image.result == 'skipped') && 'succeeded' || 'failed' }}\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

  